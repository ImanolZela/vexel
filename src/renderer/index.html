<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- img-src needs data: — thumbnails and previews are data: URLs from
         the main process (image:thumbnail, image:enhance-preview), not
         fetched resources. Without it they silently fail to render. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vexel</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
